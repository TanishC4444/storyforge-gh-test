# Generated by scripts/build_workflow.py. Commit regenerated changes.
name: Troy story runners
on:
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        options: [fixture, live]
        default: fixture
        description: Live inference executes inside these jobs, without child workflows
      profile:
        type: choice
        options: [balanced, expressive, fast, small]
        default: fast
      request_file:
        type: choice
        options: [troy-first-thunder]
        default: troy-first-thunder
      refinement_seed_run:
        type: string
        default: ''
        description: Optional prior run with saved refinement output to recover
      scene_limit:
        type: choice
        options: ['4']
        default: '4'
        description: Four scenes is the full opening movement
permissions:
  contents: read
  actions: read
concurrency:
  group: story-runners
  cancel-in-progress: false
jobs:

  prepare:
    name: Prepare request and literary retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Start shared job time budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: fixture
      - name: Install local RAG encoder when requested
        env:
          STORY_REQUEST: ${{ inputs.request_file }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          request=json.loads(Path('examples',os.environ['STORY_REQUEST']+'.json').read_text())
          if request.get('retrieval_mode')=='hybrid' and not request.get('execution_policy',{}).get('resume_seed'):
              subprocess.run([sys.executable,'-m','pip','install','-e','.[rag]'],check=True)
          PY
      - name: Execute Prepare request and literary retrieval
        id: task
        env:
          PYTHONUNBUFFERED: 1
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
          REFINEMENT_SEED_RUN: ${{ inputs.refinement_seed_run }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag prepare --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
      - name: Save outputs and execution timeline
        uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
          name: prepare
          path: out/
          retention-days: 7
          overwrite: true
      - name: Job status and artifact link
        if: always()
        env:
          STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          TASK_RESULT: ${{ job.status }}
        run: python -m storyforge.tracking report --out out

  refine:
    name: Refine initial story prompt
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Start shared job time budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.refinement_seed_run != '' && 'fixture' || inputs.backend }}
      - uses: actions/download-artifact@v4
        if: inputs.refinement_seed_run != ''
        with:
          name: refine
          path: inputs/seed
          run-id: ${{ inputs.refinement_seed_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: prepare
          path: inputs/state
      - name: Execute Refine initial story prompt
        id: task
        env:
          PYTHONUNBUFFERED: 1
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
          REFINEMENT_SEED_RUN: ${{ inputs.refinement_seed_run }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag refine --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
      - name: Save outputs and execution timeline
        uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
