name: Targeted story stress and live acceptance
on:
  push:
    branches: ['stress/coverage-*']
  workflow_dispatch:
    inputs:
      live:
        type: boolean
        default: false
        description: Also run the selected paid hosted model cases, sequentially
      live_cases:
        type: string
        default: matrix-01,matrix-02,matrix-03
        description: Select only the relevant cases; matrix-03 reproduces the audio length failure
      coverage:
        type: choice
        options: [representative, pairwise]
        default: representative
permissions:
  contents: read
  actions: write
concurrency:
  group: combinatorial-stress-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  GEMINI_DISTINCT_PROJECTS: 'true'
jobs:
  contracts-and-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e '.[test]'
          python -m pip install -e '.[api]'
      - name: Targeted stress and adapter regressions
        run: |
          python -m unittest discover -s tests -p test_combinatorial_stress.py -q
          python -m unittest discover -s tests -p test_unified_studio.py -q
      - name: Selected representative separate-runner graphs
        if: ${{ !cancelled() }}
        env:
          MATRIX_COVERAGE: ${{ inputs.coverage || 'representative' }}
        run: python -m scripts.combinatorial_stress --coverage "$MATRIX_COVERAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combinatorial-coverage-and-output
          path: stress-matrix-results/
          retention-days: 30
  live-model-acceptance:
    if: ${{ inputs.live == true || contains(github.event.head_commit.message, '[live-stress]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - name: Dispatch full runner graphs one at a time; require real approval audits
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_LIVE_CASES: ${{ inputs.live_cases || 'matrix-01,matrix-02,matrix-03' }}
        run: python -m scripts.live_matrix_stress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-matrix-audits-and-drafts
          path: live-matrix-results/
          retention-days: 30
      - name: Cancel only this queue's active child on cancellation
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.stress_queue import GitHub
          p=Path('live-matrix-results/active.json')
          active=json.loads(p.read_text()).get('run_id') if p.exists() else None
          if active:
              api=GitHub(os.environ['GITHUB_REPOSITORY'],os.environ['GH_TOKEN'])
              run=api.api('actions/runs/'+str(active))
              if run['status']!='completed':api.api(f'actions/runs/{active}/cancel','POST')
          PY
