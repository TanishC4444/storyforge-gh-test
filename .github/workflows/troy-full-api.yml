# Generated by scripts/build_workflow.py. Commit regenerated changes.
name: Troy full prompt-to-story / hosted APIs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: story-runners
  cancel-in-progress: false
jobs:
  full_process:
    name: Full process / shared API quotas and resident CPU fallback
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Start shared six-hour budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: live
      - name: Check contracts, isolation, transitions and full workflow
        run: python -m unittest discover -s tests -q
      - name: Install hybrid literary retrieval
        run: python -m pip install -e '.[rag]' -q
      - name: Full fresh prompt-to-story process
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python -m storyforge.full_flow --out runs/troy-full-api
      - name: Final reviewed story
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FINAL_STORY
          path: runs/troy-full-api/FINAL_STORY.txt
          if-no-files-found: warn
      - name: Preserve checkpoints, provisional text, API diagnostics and benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-process-diagnostics
          path: runs/troy-full-api/
          if-no-files-found: warn
