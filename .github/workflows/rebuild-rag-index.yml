name: Rebuild RAG index

on:
  workflow_dispatch:
  push:
    branches: [main, rag-gemini-embeddings]
    paths:
      - 'rag/**'
      - 'data/literary-corpus.json'
      - '.github/workflows/rebuild-rag-index.yml'

permissions:
  contents: write

# One rebuild per branch at a time so commit-backs never race each other.
concurrency:
  group: rebuild-rag-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini RAG encoder
        run: python -m pip install -e '.[rag]' -q
      - name: Embed every corpus record with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: time python -m rag.ingest --json data/literary-corpus.json
      - name: Check every row uses the Gemini encoder
        run: |
          python - <<'PY'
          import json, sqlite3
          from rag.identity import INDEX_VERSION, EMBEDDING_DIMENSIONS
          records = json.load(open('data/literary-corpus.json'))['records']
          db = sqlite3.connect('data/literary_rag.db')
          rows = db.execute('select record_id, embedding_model, embedding from rag_documents').fetchall()
          assert {r[0] for r in rows} == {r['id'] for r in records}, 'record IDs differ from corpus'
          assert {r[1] for r in rows} == {INDEX_VERSION}, 'rows on another encoder'
          assert {len(json.loads(r[2])) for r in rows} == {EMBEDDING_DIMENSIONS}, 'wrong vector size'
          print(f'{len(rows)} rows on {INDEX_VERSION}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: literary-rag-db
          path: data/literary_rag.db
          retention-days: 7
      - name: Commit the rebuilt index back to this branch
        # Pushes made with GITHUB_TOKEN do not start new workflow runs, so this cannot loop.
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # SQLite rewrites its header on any write, so compare contents, not bytes.
          git show HEAD:data/literary_rag.db > "$RUNNER_TEMP/previous.db"
          if python -c "import sqlite3,sys; dump=lambda p: list(sqlite3.connect(p).iterdump()); sys.exit(dump('$RUNNER_TEMP/previous.db') != dump('data/literary_rag.db'))"; then
            echo "Index contents unchanged; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/literary_rag.db
          git commit -m "Rebuild literary RAG index with Gemini embeddings" -m "Generated by rebuild-rag-index run ${{ github.run_id }} from ${{ github.sha }}."
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
