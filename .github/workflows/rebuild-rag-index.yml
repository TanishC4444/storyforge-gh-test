name: Rebuild RAG index

on:
  workflow_dispatch:
  push:
    branches: [main, rag-gemini-embeddings]
    paths:
      - 'rag/**'
      - 'data/literary-corpus.json'
      - '.github/workflows/rebuild-rag-index.yml'

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini RAG encoder
        run: python -m pip install -e '.[rag]' -q
      - name: Embed every corpus record with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: time python -m rag.ingest --json data/literary-corpus.json
      - name: Check every row uses the Gemini encoder
        run: |
          python - <<'PY'
          import json, sqlite3
          from rag.identity import INDEX_VERSION, EMBEDDING_DIMENSIONS
          records = json.load(open('data/literary-corpus.json'))['records']
          db = sqlite3.connect('data/literary_rag.db')
          rows = db.execute('select record_id, embedding_model, embedding from rag_documents').fetchall()
          assert {r[0] for r in rows} == {r['id'] for r in records}, 'record IDs differ from corpus'
          assert {r[1] for r in rows} == {INDEX_VERSION}, 'rows on another encoder'
          assert {len(json.loads(r[2])) for r in rows} == {EMBEDDING_DIMENSIONS}, 'wrong vector size'
          print(f'{len(rows)} rows on {INDEX_VERSION}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: literary-rag-db
          path: data/literary_rag.db
          retention-days: 7
