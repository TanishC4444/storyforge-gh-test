name: Enrich literary corpus

# Runs when the enrichment script or this file changes on the branch. ENRICH_LIMIT
# caps records per run (0 = every remaining main-line record); runs resume where
# the last one stopped because enriched records are skipped.
on:
  workflow_dispatch:
  push:
    branches: [rag-gemini-embeddings]
    paths:
      - 'scripts/enrich_corpus.py'
      - '.github/workflows/enrich-corpus.yml'

permissions:
  contents: write

concurrency:
  group: enrich-corpus-${{ github.ref }}
  cancel-in-progress: false

env:
  ENRICH_LIMIT: '10'

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini RAG encoder
        run: python -m pip install -e '.[rag]' -q
      - name: Draft story detail for main-line records with Gemini
        id: enrich
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: time python -m scripts.enrich_corpus --limit "$ENRICH_LIMIT"
      # Progress is saved after every batch, so keep partial work even if a later batch fails.
      - name: Re-embed changed records with Gemini
        if: always() && steps.enrich.outcome != 'skipped'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: time python -m rag.ingest --json data/literary-corpus.json
      - name: Check corpus and index agree
        if: always() && steps.enrich.outcome != 'skipped'
        run: |
          python - <<'PY'
          import json, sqlite3
          from rag.documents import document_text
          from rag.identity import INDEX_VERSION, EMBEDDING_DIMENSIONS
          records = json.load(open('data/literary-corpus.json'))['records']
          rows = sqlite3.connect('data/literary_rag.db').execute('select record_id, embedding_model, embedding, content from rag_documents').fetchall()
          assert {r[0] for r in rows} == {r['id'] for r in records}, 'record IDs differ from corpus'
          assert {r[1] for r in rows} == {INDEX_VERSION}, 'rows on another encoder'
          assert {len(json.loads(r[2])) for r in rows} == {EMBEDDING_DIMENSIONS}, 'wrong vector size'
          text = {r['id']: document_text(r) for r in records}
          assert all(text[r[0]] == r[3] for r in rows), 'index text is stale'
          enriched = sum('enrichment' in r['provenance'] for r in records)
          print(f'{len(rows)} rows current on {INDEX_VERSION}; {enriched} records enriched')
          PY
      - name: Commit corpus and index back to this branch
        if: always() && steps.enrich.outcome != 'skipped'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- data/literary-corpus.json; then
            echo "Corpus unchanged; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/literary-corpus.json data/literary_rag.db
          git commit -m "Enrich main-line corpus records and re-embed with Gemini" -m "Generated by enrich-corpus run ${{ github.run_id }} from ${{ github.sha }}."
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
