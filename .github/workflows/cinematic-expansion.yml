name: Cinematic universe expansion / classic runners
'on':
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        options:
        - fixture
        - live
        default: fixture
        description: Live inference executes inside these jobs, without child workflows
      profile:
        type: choice
        options:
        - balanced
        - expressive
        - fast
        - small
        default: fast
      request_file:
        type: string
        default: classic-universe-practice
        description: Author universe bible and explicit next-scene layout in examples/
      scene_limit:
        type: choice
        options:
        - '1'
        - '2'
        - '3'
        - '4'
        - '9'
        default: '1'
      canon_run:
        type: string
        default: ''
        description: Optional prior accepted universe-canon checkpoint; requires a new episode brief
permissions:
  contents: read
  actions: read
concurrency:
  group: classic-universe-expansion
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare request and literary retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: fixture
    - name: Check inference contracts before benchmark
      run: python -m unittest discover -s tests -q
    - name: Execute Prepare request and literary retrieval
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        GEMINI_DISTINCT_PROJECTS: 'true'
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag prepare --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: prepare
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '600'
      STORY_BATCH_TIMEOUT_SECONDS: '600'
  quickstart:
    name: Compile author brief and scene layout without inference
    needs:
    - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: fixture
    - uses: actions/download-artifact@v4
      if: ${{ inputs.canon_run != '' }}
      with:
        name: universe-canon
        path: inputs/canon
        run-id: ${{ inputs.canon_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@v4
      with:
        name: prepare
        path: inputs/state
    - name: Execute Refine initial story prompt
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        CANON_RUN: ${{ inputs.canon_run }}
        GEMINI_DISTINCT_PROJECTS: 'true'
      run: 'extra=()

        if [ -n "$CANON_RUN" ]; then extra=(--checkpoint inputs/canon/snapshot.json); fi

        python -m storyforge.expansion prepare --source inputs/state/snapshot.json --out out "${extra[@]}"'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: quickstart
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '600'
      STORY_BATCH_TIMEOUT_SECONDS: '600'
  s01_design:
    name: Chapter 1 scene 1 / reconcile design with accepted state
    needs:
    - quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: ${{ inputs.backend }}
    - uses: actions/download-artifact@v4
      with:
        name: quickstart
        path: inputs/state
    - name: Execute Chapter 1 scene 1 / reconcile design with accepted state
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        GEMINI_DISTINCT_PROJECTS: 'true'
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag scene_design --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
        --index 0

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_design
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '600'
      STORY_BATCH_TIMEOUT_SECONDS: '600'
  s01_characters:
    name: Chapter 1 scene 1 / character ${{ matrix.character }}
    needs:
    - s01_design
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        character: ${{ fromJSON(needs.s01_design.outputs.characters) }}
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: ${{ inputs.backend }}
    - uses: actions/download-artifact@v4
      with:
        name: s01_design
        path: inputs/state
    - name: Execute Chapter 1 scene 1 / character ${{ matrix.character }}
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        STORY_CHARACTER: ${{ matrix.character }}
        GEMINI_DISTINCT_PROJECTS: 'true'
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag character --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
        --index 0 --character "$STORY_CHARACTER"

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_characters-${{ matrix.character }}
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '600'
      STORY_BATCH_TIMEOUT_SECONDS: '600'
  s01_direction:
    name: Chapter 1 scene 1 / reconcile character choices
    needs:
    - s01_design
    - s01_characters
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: ${{ inputs.backend }}
    - uses: actions/download-artifact@v4
      with:
        name: s01_design
        path: inputs/state
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_characters-*
        path: inputs/characters
    - name: Execute Chapter 1 scene 1 / reconcile character choices
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        GEMINI_DISTINCT_PROJECTS: 'true'
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag director --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
        --index 0

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_direction
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '600'
      STORY_BATCH_TIMEOUT_SECONDS: '600'
  s01_draft:
    name: Compile writing batches without rewriting
    needs:
    - s01_design
    - s01_draft_plan
    - s01_write_batches
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: fixture
    - uses: actions/download-artifact@v4
      with:
        name: s01_design
        path: inputs/state
    - uses: actions/download-artifact@v4
      with:
        name: s01_draft_plan
        path: inputs/plan
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_write_batches-*
        path: inputs/batches
    - name: Compile writing batches without rewriting
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        GEMINI_DISTINCT_PROJECTS: 'true'
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline merge_draft --backend "$backend" --index 0'
    - name: Show generated prose before final acceptance
      if: always()
      run: python -m storyforge.expansion preview --source out --label "Compile writing batches without rewriting"
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_draft
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '600'
      STORY_BATCH_TIMEOUT_SECONDS: '600'
  s01_edit:
    name: Forward prose unchanged for source-bound reviews
    needs:
    - s01_design
    - s01_draft
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: fixture
    - uses: actions/download-artifact@v4
      with:
        name: s01_design
        path: inputs/state
    - uses: actions/download-artifact@v4
      with:
        name: s01_draft
        path: inputs/draft
    - name: Forward prose unchanged for source-bound reviews
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        GEMINI_DISTINCT_PROJECTS: 'true'
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline forward --backend "$backend" --index 0'
    - name: Show generated prose before final acceptance
      if: always()
      run: python -m storyforge.expansion preview --source out --label "Forward prose unchanged for source-bound reviews"
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_edit
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '600'
      STORY_BATCH_TIMEOUT_SECONDS: '600'
  s01_story:
    name: Compile causal findings; preserve partial results
    needs:
    - s01_design
    - s01_edit
    - s01_story_batches
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: fixture
    - uses: actions/download-artifact@v4
      with:
        name: s01_design
        path: inputs/state
    - uses: actions/download-artifact@v4
      with:
        name: s01_edit
        path: inputs/edited
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_story_batches-*
        path: inputs/batches
    - name: Compile causal findings; preserve partial results
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        GEMINI_DISTINCT_PROJECTS: 'true'
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline join_reviews --backend "$backend" --index 0 --kind story'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_story
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '600'
      STORY_BATCH_TIMEOUT_SECONDS: '600'
  s01_rhetoric:
    name: Compile prose findings; preserve partial results
    needs:
    - s01_design
    - s01_edit
    - s01_section_plan
    - s01_rhetoric_batches
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: fixture
    - uses: actions/download-artifact@v4
      with:
        name: s01_design
        path: inputs/state
    - uses: actions/download-artifact@v4
      with:
        name: s01_edit
        path: inputs/edited
    - uses: actions/download-artifact@v4
      with:
        name: s01_section_plan
        path: inputs/plan
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_rhetoric_batches-*
        path: inputs/batches
    - name: Compile prose findings; preserve partial results
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        GEMINI_DISTINCT_PROJECTS: 'true'
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline section_reviews_join --backend "$backend" --index 0'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_rhetoric
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '600'
      STORY_BATCH_TIMEOUT_SECONDS: '600'
  s01_memory:
    name: Compile complete source-bound memory; no summary substitution
    needs:
    - s01_design
    - s01_edit
    - s01_memory_extract_plan
    - s01_memory_extract_batches
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: fixture
    - uses: actions/download-artifact@v4
      with:
        name: s01_design
        path: inputs/state
    - uses: actions/download-artifact@v4
      with:
        name: s01_edit
        path: inputs/edited
    - uses: actions/download-artifact@v4
      with:
        name: s01_memory_extract_plan
        path: inputs/plan
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_memory_extract_batches-*
        path: inputs/batches
    - name: Compile complete source-bound memory; no summary substitution
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        GEMINI_DISTINCT_PROJECTS: 'true'
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline memory_extract_join --backend "$backend" --index 0'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_memory
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '600'
      STORY_BATCH_TIMEOUT_SECONDS: '600'
  s01_repair:
    name: Merge targeted fixes; preserve untouched paragraphs
    needs:
    - s01_design
    - s01_edit
    - s01_repair_plan
    - s01_repair_batches
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: fixture
    - uses: actions/download-artifact@v4
      with:
        name: s01_design
        path: inputs/state
    - uses: actions/download-artifact@v4
      with:
        name: s01_edit
        path: inputs/edited
    - uses: actions/download-artifact@v4
      with:
        name: s01_repair_plan
        path: inputs/plan
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_repair_batches-*
        path: inputs/batches
    - name: Merge targeted fixes; preserve untouched paragraphs
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        GEMINI_DISTINCT_PROJECTS: 'true'
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline merge_repairs --backend "$backend" --index 0'
    - name: Show generated prose before final acceptance
      if: always()
      run: python -m storyforge.expansion preview --source out --label "Merge targeted fixes; preserve untouched paragraphs"
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_repair
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '600'
      STORY_BATCH_TIMEOUT_SECONDS: '600'
  s01_verify:
    name: Reuse final story verdict
    needs:
    - s01_design
    - s01_final_check
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: fixture
    - uses: actions/download-artifact@v4
      with:
        name: s01_design
