        0

        '
    - name: Show generated prose before final acceptance
      if: always()
      run: python -m storyforge.expansion preview --source out --label "Writer draft"
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_draft
        path: out/
