name: Cinematic universe expansion / classic runners
'on':
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        options:
        - fixture
        - live
        default: fixture
        description: Live inference executes inside these jobs, without child workflows
      profile:
        type: choice
        options:
        - balanced
        - expressive
        - fast
        - small
        default: fast
      request_file:
        type: string
        default: classic-universe-practice
        description: Author universe bible and explicit next-scene layout in examples/
      scene_limit:
        type: choice
        options:
        - '1'
        - '3'
        - '9'
        default: '1'
      canon_run:
        type: string
        default: ''
        description: Optional prior accepted universe-canon checkpoint; requires a new episode brief
permissions:
  contents: read
  actions: read
concurrency:
  group: classic-universe-expansion
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare request and literary retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: fixture
    - name: Check inference contracts before benchmark
      run: python -m unittest discover -s tests -q
    - name: Execute Prepare request and literary retrieval
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag prepare --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: prepare
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '1800'
  quickstart:
    name: Compile author brief and scene layout without inference
    needs:
    - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: fixture
    - uses: actions/download-artifact@v4
      if: ${{ inputs.canon_run != '' }}
      with:
        name: universe-canon
        path: inputs/canon
        run-id: ${{ inputs.canon_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@v4
      with:
        name: prepare
        path: inputs/state
    - name: Execute Refine initial story prompt
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        CANON_RUN: ${{ inputs.canon_run }}
      run: 'extra=()

        if [ -n "$CANON_RUN" ]; then extra=(--checkpoint inputs/canon/snapshot.json); fi

        python -m storyforge.expansion prepare --source inputs/state/snapshot.json --out out "${extra[@]}"'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: quickstart
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '1800'
  s01_design:
    name: Chapter 1 scene 1 / reconcile design with accepted state
    needs:
    - quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: ${{ inputs.backend }}
    - uses: actions/download-artifact@v4
      with:
        name: quickstart
        path: inputs/state
    - name: Execute Chapter 1 scene 1 / reconcile design with accepted state
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag scene_design --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
        --index 0

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_design
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '1800'
  s01_characters:
    name: Chapter 1 scene 1 / character ${{ matrix.character }}
    needs:
    - s01_design
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        character: ${{ fromJSON(needs.s01_design.outputs.characters) }}
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: ${{ inputs.backend }}
    - uses: actions/download-artifact@v4
      with:
        name: s01_design
        path: inputs/state
    - name: Execute Chapter 1 scene 1 / character ${{ matrix.character }}
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        STORY_CHARACTER: ${{ matrix.character }}
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag character --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
        --index 0 --character "$STORY_CHARACTER"

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_characters-${{ matrix.character }}
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '1800'
  s01_direction:
    name: Chapter 1 scene 1 / reconcile character choices
    needs:
    - s01_design
    - s01_characters
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
