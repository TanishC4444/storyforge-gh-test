name: Living universe / verified-memory pipeline
'on':
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        options:
        - fixture
        - live
        default: fixture
        description: Live inference executes inside these jobs, without child workflows
      profile:
        type: choice
        options:
        - balanced
        - expressive
        - fast
        - small
        default: fast
      request_file:
        type: string
        default: living-scale-practice
        description: Author universe bible and explicit next-scene layout in examples/
      scene_limit:
        type: choice
        options:
        - '1'
        - '2'
        - '4'
        default: '2'
        description: One growing-world event or a two/four-chapter bounded episode
      resume_run:
        type: string
        default: ''
        description: Prior accepted universe-canon run; empty starts a world
      checkpoint_artifact:
        type: choice
        options:
        - universe-canon
        - quickstart
        default: universe-canon
        description: Use quickstart only to retry a failed event while retaining its saved random draw
permissions:
  contents: read
  actions: read
concurrency:
  group: story-universe-provider-budget
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare request and literary retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - &id001
      name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - &id002
      uses: actions/checkout@v4
    - &id009
      uses: ./.github/actions/setup-worker
      with:
        backend: fixture
        hosted-only: 'true'
    - name: Check inference contracts before benchmark
      run: 'python -m pip install -e ''.[test]'' -q

        python -m unittest discover -s tests -p test_preflight.py -q

        '
    - name: Execute Prepare request and literary retrieval
      id: task
      env: &id006
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag prepare --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: prepare
        path: out/
        retention-days: 30
        overwrite: true
    - &id003
      name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env: &id004
      STORY_REVIEW_TIMEOUT_SECONDS: '120'
      STORY_BATCH_TIMEOUT_SECONDS: '180'
  quickstart:
    name: Compile universe beginning or bounded episode layout
    needs:
    - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - &id005
      uses: ./.github/actions/setup-worker
      with:
        backend: ${{ inputs.backend }}
        hosted-only: 'true'
    - uses: actions/download-artifact@v4
      if: ${{ inputs.resume_run != '' }}
      with:
        name: ${{ inputs.checkpoint_artifact }}
        path: inputs/canon
        run-id: ${{ inputs.resume_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@v4
      with:
        name: prepare
        path: inputs/state
    - name: Execute Refine initial story prompt
      id: task
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        CANON_RUN: ${{ inputs.resume_run }}
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        extra=()

        if [ -n "$CANON_RUN" ]; then extra=(--checkpoint inputs/canon/snapshot.json); fi

        python -m storyforge.living_prepare --backend "$backend" --source inputs/state/snapshot.json --out out "${extra[@]}"'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: quickstart
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_design:
    name: Reconcile scene 1 with verified prior memory
    needs:
    - quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id005
    - uses: actions/download-artifact@v4
      with:
        name: quickstart
        path: inputs/state
    - name: Reconcile scene 1 with verified prior memory
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag scene_design --backend "$backend" --index 0'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_design
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    outputs: &id008
      characters: ${{ steps.task.outputs.characters }}
  s01_characters:
    name: Independent character ${{ matrix.character }} / scene 1
    needs:
    - s01_design
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id005
    - &id007
      uses: actions/download-artifact@v4
      with:
        name: s01_design
        path: inputs/state
    - name: Independent character ${{ matrix.character }} / scene 1
      id: task
      env: &id024
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        STORY_CHARACTER: ${{ matrix.character }}
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag character --backend "$backend" --index 0 --character "$STORY_CHARACTER"'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_characters-${{ matrix.character }}
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        character: ${{ fromJSON(needs.s01_design.outputs.characters) }}
  s01_direction:
    name: Compile character direction and writing plan
    needs:
    - s01_design
    - s01_characters
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id005
    - *id007
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_characters-*
        path: inputs/characters
    - name: Compile character direction and writing plan
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.living_stages direction_plan --backend "$backend" --index 0'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_direction
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
    outputs: *id008
  s01_write_batches:
    name: Write coherent scene / batch ${{ matrix.batch }}
    needs:
    - s01_design
    - s01_direction
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id005
    - *id007
    - &id010
      uses: actions/download-artifact@v4
      with:
        name: s01_direction
        path: inputs/plan
    - name: Write coherent scene / batch ${{ matrix.batch }}
      id: task
      env: &id011
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        STORY_BATCH: ${{ matrix.batch }}
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline write_batch --backend "$backend" --index 0 --batch "$STORY_BATCH"'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_write_batches-${{ matrix.batch }}
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJSON(needs.s01_direction.outputs.characters) }}
  s01_draft:
    name: Compile readable draft and source extraction plan
    needs:
    - s01_design
    - s01_direction
    - s01_write_batches
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id009
    - *id007
    - *id010
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_write_batches-*
        path: inputs/batches
    - name: Compile readable draft and source extraction plan
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.living_stages draft_extract_plan --backend "$backend" --index 0'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_draft
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
    outputs: *id008
  s01_story_batches:
    name: Full-scene story checks / batch ${{ matrix.batch }}
    needs:
    - s01_design
    - s01_draft
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id005
    - *id007
    - &id012
      uses: actions/download-artifact@v4
      with:
        name: s01_draft
        path: inputs/edited
    - name: Full-scene story checks / batch ${{ matrix.batch }}
      id: task
      env: *id011
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline review_batch --backend "$backend" --index 0 --group "$STORY_BATCH" --kind story'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_story_batches-${{ matrix.batch }}
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
    strategy: &id013
      fail-fast: false
      max-parallel: 2
      matrix:
        batch:
        - 0
  s01_rhetoric_batches:
    name: Full-scene rhetoric checks / batch ${{ matrix.batch }}
    needs:
    - s01_design
    - s01_draft
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id005
    - *id007
    - *id012
    - name: Full-scene rhetoric checks / batch ${{ matrix.batch }}
      id: task
      env: *id011
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline review_batch --backend "$backend" --index 0 --group "$STORY_BATCH" --kind rhetoric'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_rhetoric_batches-${{ matrix.batch }}
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
    strategy: *id013
  s01_memory_extract_batches:
    name: Extract source-supported facts / batch ${{ matrix.batch }}
    needs:
    - s01_design
    - s01_draft
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id005
    - *id007
    - *id012
    - &id014
      uses: actions/download-artifact@v4
      with:
        name: s01_draft
        path: inputs/plan
    - name: Extract source-supported facts / batch ${{ matrix.batch }}
      id: task
      env: *id011
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline memory_extract_batch --backend "$backend" --index 0 --batch "$STORY_BATCH"'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_memory_extract_batches-${{ matrix.batch }}
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        batch: ${{ fromJSON(needs.s01_draft.outputs.characters) }}
  s01_memory:
    name: Compile full memory and allocate exhaustive checks
    needs:
    - s01_design
    - s01_draft
    - s01_memory_extract_batches
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id009
    - *id007
    - *id012
    - *id014
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_memory_extract_batches-*
        path: inputs/batches
    - name: Compile full memory and allocate exhaustive checks
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.living_stages memory_compile_plan --backend "$backend" --index 0'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_memory
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
    outputs: *id008
  s01_memory_preflight_batches:
    name: Check every fact/history/source partition / ${{ matrix.batch }}
    needs:
    - s01_design
    - s01_draft
    - s01_memory
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id005
    - *id007
    - *id012
    - &id015
      uses: actions/download-artifact@v4
      with:
        name: s01_memory
        path: inputs/memory
    - &id016
      uses: actions/download-artifact@v4
      with:
        name: s01_memory
        path: inputs/plan
    - name: Check every fact/history/source partition / ${{ matrix.batch }}
      id: task
      env: *id011
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline memory_check_batch --backend "$backend" --index 0 --batch "$STORY_BATCH"'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_memory_preflight_batches-${{ matrix.batch }}
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        batch: ${{ fromJSON(needs.s01_memory.outputs.characters) }}
  s01_memory_preflight:
    name: Join independently verified factual findings
    needs:
    - s01_design
    - s01_draft
    - s01_memory
    - s01_memory_preflight_batches
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id009
    - *id007
    - *id012
    - *id015
    - *id016
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_memory_preflight_batches-*
        path: inputs/batches
    - name: Join independently verified factual findings
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline memory_check_join --backend "$backend" --index 0'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_memory_preflight
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_repair_plan:
    name: Compile literary findings and allocate targeted edits
    needs:
    - s01_design
    - s01_draft
    - s01_story_batches
    - s01_rhetoric_batches
    - s01_memory_preflight
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id009
    - *id007
    - *id012
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_story_batches-*
        path: inputs/story-batches
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_rhetoric_batches-*
        path: inputs/rhetoric-batches
    - uses: actions/download-artifact@v4
      with:
        name: s01_memory_preflight
        path: inputs/memory-review
    - name: Compile literary findings and allocate targeted edits
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.living_stages repair_plan --backend "$backend" --index 0'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_repair_plan
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
    outputs: *id008
  s01_repair_batches:
    name: Repair only source-owned disputed passages / ${{ matrix.batch }}
    needs:
    - s01_design
    - s01_repair_plan
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id005
    - *id007
    - &id017
      uses: actions/download-artifact@v4
      with:
        name: s01_repair_plan
        path: inputs/plan
    - name: Repair only source-owned disputed passages / ${{ matrix.batch }}
      id: task
      env: *id011
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline repair_batch --backend "$backend" --index 0 --batch "$STORY_BATCH"'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_repair_batches-${{ matrix.batch }}
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJSON(needs.s01_repair_plan.outputs.characters) }}
  s01_repair:
    name: Merge edits and plan changed-evidence refresh
    needs:
    - s01_design
    - s01_draft
    - s01_repair_plan
    - s01_repair_batches
    - s01_memory
    - s01_memory_preflight
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id009
    - *id007
    - *id012
    - *id017
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_repair_batches-*
        path: inputs/batches
    - &id018
      uses: actions/download-artifact@v4
      with:
        name: s01_memory
        path: inputs/initial-memory
    - &id021
      uses: actions/download-artifact@v4
      with:
        name: s01_memory_preflight
        path: inputs/preflight-memory
    - name: Merge edits and plan changed-evidence refresh
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.living_stages repair_refresh_plan --backend "$backend" --index 0'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_repair
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
    outputs: &id032
      characters: ${{ steps.task.outputs.characters }}
      refresh_required: ${{ steps.task.outputs.refresh_required }}
  s01_final_check:
    name: One final strict judgment; reuse only exact passing evidence
    needs:
    - s01_design
    - s01_repair
    - s01_draft
    - s01_repair_plan
    - s01_memory
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id009
    - *id007
    - &id019
      uses: actions/download-artifact@v4
      with:
        name: s01_repair
        path: inputs/edited
    - uses: actions/download-artifact@v4
      with:
        name: s01_draft
        path: inputs/original
    - uses: actions/download-artifact@v4
      with:
        name: s01_repair_plan
        path: inputs/findings
    - *id018
    - name: One final strict judgment; reuse only exact passing evidence
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.living_stages finalize --backend "$backend" --index 0'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_final_check
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_memory_refresh_batches:
    name: Refresh only changed source facts / ${{ matrix.batch }}
    needs:
    - s01_design
    - s01_repair
    if: ${{ 0 < fromJSON(inputs.scene_limit) && needs.s01_repair.outputs.refresh_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id005
    - *id007
    - *id019
    - &id020
      uses: actions/download-artifact@v4
      with:
        name: s01_repair
        path: inputs/plan
    - name: Refresh only changed source facts / ${{ matrix.batch }}
      id: task
      env: *id011
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline memory_extract_batch --backend "$backend" --index 0 --batch "$STORY_BATCH"'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_memory_refresh_batches-${{ matrix.batch }}
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        batch: ${{ fromJSON(needs.s01_repair.outputs.characters) }}
  s01_final_memory:
    name: Compile complete final memory and reuse exact factual proof
    needs:
    - s01_design
    - s01_repair
    - s01_memory_preflight
    - s01_memory_refresh_batches
    if: ${{ always() && !cancelled() && 0 < fromJSON(inputs.scene_limit) && needs.s01_repair.result == 'success' && (needs.s01_memory_refresh_batches.result
      == 'success' || needs.s01_memory_refresh_batches.result == 'skipped') }}
