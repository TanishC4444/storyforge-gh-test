    - s03_rhetoric_batches
    - s03_memory_extract_batches
    - s03_memory
    - s03_memory_preflight_batches
    - s03_memory_preflight
    - s03_repair_plan
    - s03_repair_batches
    - s03_repair
    - s03_final_check
    - s03_memory_refresh_batches
    - s03_final_memory
    - s03_memory_final_batches
    - s03_memory_review
    - s03_accept
    - s04_design
    - s04_characters
    - s04_direction
    - s04_write_batches
    - s04_draft
    - s04_story_batches
    - s04_rhetoric_batches
    - s04_memory_extract_batches
    - s04_memory
