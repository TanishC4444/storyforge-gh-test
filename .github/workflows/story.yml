  plan_review:
    name: Development editor / critique scene progression
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: inputs/state
      - name: Run scoped story task
        id: task
        env:
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
          REFINEMENT_SEED_RUN: ${{ inputs.refinement_seed_run }}
        run: |
