      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine_revision
          path: out/
          retention-days: 7
          overwrite: true

  refine_gate:
    name: Approve developed story before outlining
    needs: [refine_revision]
    runs-on: ubuntu-latest
