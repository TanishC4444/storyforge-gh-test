    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: refine_revision
          path: inputs/state
      - name: Run scoped story task
        id: task
        env:
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
          REFINEMENT_SEED_RUN: ${{ inputs.refinement_seed_run }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag refine_gate --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine_gate
          path: out/
          retention-days: 7
          overwrite: true

  plan:
    name: Plan three chapters
    needs: [refine_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      characters: ${{ steps.task.outputs.characters }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: refine_gate
          path: inputs/state
      - name: Run scoped story task
        id: task
        env:
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
          REFINEMENT_SEED_RUN: ${{ inputs.refinement_seed_run }}
        run: |
