# Generated by scripts/build_workflow.py. Commit regenerated changes.
name: Story runners
on:
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        options: [fixture, live]
        default: fixture
        description: Live inference executes inside these jobs, without child workflows
      profile:
        type: choice
        options: [balanced, expressive, small]
        default: balanced
      request_file:
        type: choice
        options: [silent-bell-deep, silent-bell-full, harbor]
        default: silent-bell-deep
      refinement_seed_run:
        type: string
        default: ''
        description: Optional prior run with saved refinement output to recover
      scene_limit:
        type: choice
        options: ['9', '3', '1']
        default: '9'
        description: Nine scenes is the full three-chapter test
permissions:
  contents: read
  actions: read
concurrency:
  group: story-runners
  cancel-in-progress: false
jobs:

  prepare:
    name: Prepare request and literary retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: fixture
      - name: Install local RAG encoder when requested
        env:
          STORY_REQUEST: ${{ inputs.request_file }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          request=json.loads(Path('examples',os.environ['STORY_REQUEST']+'.json').read_text())
          if request.get('retrieval_mode')=='hybrid':
              subprocess.run([sys.executable,'-m','pip','install','-e','.[rag]'],check=True)
          PY
      - name: Run scoped story task
        id: task
        env:
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
          REFINEMENT_SEED_RUN: ${{ inputs.refinement_seed_run }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag prepare --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepare
          path: out/
          retention-days: 7
          overwrite: true

  refine:
    name: Refine initial story prompt
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.refinement_seed_run != '' && 'fixture' || inputs.backend }}
      - uses: actions/download-artifact@v4
        if: inputs.refinement_seed_run != ''
        with:
          name: refine
          path: inputs/seed
          run-id: ${{ inputs.refinement_seed_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: prepare
          path: inputs/state
      - name: Run scoped story task
        id: task
        env:
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
          REFINEMENT_SEED_RUN: ${{ inputs.refinement_seed_run }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag refine --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine
          path: out/
          retention-days: 7
          overwrite: true

  refine_review:
    name: Development editor / critique initial story
    needs: [refine]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: refine
          path: inputs/state
      - name: Run scoped story task
        id: task
        env:
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
          REFINEMENT_SEED_RUN: ${{ inputs.refinement_seed_run }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag refine_review --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine_review
          path: out/
          retention-days: 7
          overwrite: true

  refine_revision:
    name: Revise initial story against development review
    needs: [refine_review]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: refine_review
          path: inputs/state
      - uses: actions/download-artifact@v4
        with:
          name: refine_review
          path: inputs/design-review
      - name: Run scoped story task
        id: task
