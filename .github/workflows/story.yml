  plan_revision:
    name: Revise chapter structure and causal choices
    needs: [plan_review]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: plan_review
          path: inputs/state
      - uses: actions/download-artifact@v4
        with:
          name: plan_review
          path: inputs/design-review
      - name: Run scoped story task
        id: task
        env:
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
