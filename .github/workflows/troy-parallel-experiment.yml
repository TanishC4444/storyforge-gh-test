# Generated by scripts/build_workflow.py. Commit regenerated changes.
name: Troy parallel repair and beat experiment
on:
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        options: [fixture, live]
        default: fixture
        description: Live inference executes inside these jobs, without child workflows
      profile:
        type: choice
        options: [balanced, expressive, fast, small]
        default: fast
      request_file:
        type: choice
        options: [troy-parallel-experiment]
        default: troy-parallel-experiment
      refinement_seed_run:
        type: string
        default: ''
        description: Optional prior run with saved refinement output to recover
      scene_limit:
        type: choice
        options: ['4']
        default: '4'
        description: Four scenes is the full opening movement
permissions:
  contents: read
  actions: read
concurrency:
  group: story-parallel-experiment
  cancel-in-progress: false
jobs:

  prepare:
    name: Prepare fresh brief and retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
      needs_repair: ${{ steps.task.outputs.needs_repair }}
      changed: ${{ steps.task.outputs.changed }}
      facts_changed: ${{ steps.task.outputs.facts_changed }}
    steps:
      - name: Start shared job budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: fixture
      - name: Check contracts and fixture paths
        run: python -m unittest discover -s tests -q
      - name: Install hybrid retrieval
        run: python -m pip install -e '.[rag]' -q
      - name: Execute Prepare fresh brief and retrieval
        id: task
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag prepare --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepare
          path: out/
          retention-days: 7
          overwrite: true

  refine_bundle:
    name: Refine, develop, revise and gate
    needs: [prepare]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
      needs_repair: ${{ steps.task.outputs.needs_repair }}
      changed: ${{ steps.task.outputs.changed }}
      facts_changed: ${{ steps.task.outputs.facts_changed }}
    steps:
      - name: Start shared job budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: prepare
          path: inputs/state
      - name: Execute Refine, develop, revise and gate
        id: task
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
        run: |
