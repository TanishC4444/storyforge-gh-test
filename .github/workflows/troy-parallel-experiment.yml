accept, s10_design, s09_settle, s10_characters, s10_direction, s10_draft, s10_edit, s10_story, s10_rhetoric, s10_memory, s10_repair, s10_verify, s10_verify_rhetoric, s10_final_memory, s10_memory_review, s10_accept, s11_design, s10_settle, s11_characters, s11_direction, s11_draft, s11_edit, s11_story, s11_rhetoric, s11_memory, s11_repair, s11_verify, s11_verify_rhetoric, s11_final_memory, s11_memory_review, s11_accept, s12_design, s11_settle, s12_characters, s12_direction, s12_draft, s12_edit, s12_story, s12_rhetoric, s12_memory, s12_repair, s12_verify, s12_verify_rhetoric, s12_final_memory, s12_memory_review, s12_accept]
