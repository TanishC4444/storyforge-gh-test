name: Living universe / Gemini-first / batched runner graph
'on':
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        options:
        - fixture
        - live
        default: fixture
        description: Live inference executes inside these jobs, without child workflows
      profile:
        type: choice
        options:
        - balanced
        - expressive
        - fast
        - small
        default: fast
      request_file:
        type: string
        default: local-universe-massive
        description: Author universe bible and explicit next-scene layout in examples/
      scene_limit:
        type: choice
        options:
        - '1'
        - '2'
        - '4'
        default: '1'
        description: One growing-world event or a two/four-chapter bounded episode
      resume_run:
        type: string
        default: ''
        description: Prior accepted universe-canon run; empty starts a world
      checkpoint_artifact:
        type: choice
        options:
        - universe-canon
        - quickstart
        default: universe-canon
        description: Use quickstart only to retry a failed event while retaining its saved random draw
permissions:
  contents: read
  actions: read
concurrency:
  group: story-universe-provider-budget
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare request and literary retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - &id001
      name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - &id002
      uses: actions/checkout@v4
    - &id008
      uses: ./.github/actions/setup-worker
      with:
        backend: fixture
        hosted-only: 'true'
    - name: Check inference contracts before benchmark
      run: 'python -m pip install -e ''.[test]'' -q

        python -m unittest discover -s tests -p test_preflight.py -q

        '
    - name: Execute Prepare request and literary retrieval
      id: task
      env: &id006
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag prepare --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: prepare
        path: out/
        retention-days: 30
        overwrite: true
    - &id003
      name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env: &id004
      STORY_REVIEW_TIMEOUT_SECONDS: '120'
      STORY_BATCH_TIMEOUT_SECONDS: '180'
  quickstart:
    name: Compile universe beginning or bounded episode layout
    needs:
    - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - &id005
      uses: ./.github/actions/setup-worker
      with:
        backend: ${{ inputs.backend }}
        hosted-only: 'true'
    - uses: actions/download-artifact@v4
      if: ${{ inputs.resume_run != '' }}
      with:
        name: ${{ inputs.checkpoint_artifact }}
        path: inputs/canon
        run-id: ${{ inputs.resume_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@v4
      with:
        name: prepare
        path: inputs/state
    - name: Execute Refine initial story prompt
      id: task
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        CANON_RUN: ${{ inputs.resume_run }}
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        extra=()

        if [ -n "$CANON_RUN" ]; then extra=(--checkpoint inputs/canon/snapshot.json); fi

        python -m storyforge.living_prepare --backend "$backend" --source inputs/state/snapshot.json --out out "${extra[@]}"'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: quickstart
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_design:
    name: Chapter 1 scene 1 / reconcile design with accepted state
    needs:
    - quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs: &id012
      characters: ${{ steps.task.outputs.characters }}
    steps:
    - *id001
    - *id002
    - *id005
    - uses: actions/download-artifact@v4
      with:
        name: quickstart
        path: inputs/state
    - name: Execute Chapter 1 scene 1 / reconcile design with accepted state
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag scene_design --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
        --index 0

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_design
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_characters:
    name: Chapter 1 scene 1 / character ${{ matrix.character }}
    needs:
    - s01_design
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        character: ${{ fromJSON(needs.s01_design.outputs.characters) }}
    steps:
    - *id001
    - *id002
    - *id005
    - &id007
      uses: actions/download-artifact@v4
      with:
        name: s01_design
        path: inputs/state
    - name: Execute Chapter 1 scene 1 / character ${{ matrix.character }}
      id: task
      env: &id014
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        STORY_CHARACTER: ${{ matrix.character }}
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag character --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
        --index 0 --character "$STORY_CHARACTER"

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_characters-${{ matrix.character }}
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_direction:
    name: Chapter 1 scene 1 / reconcile character choices
    needs:
    - s01_design
    - s01_characters
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id005
    - *id007
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_characters-*
        path: inputs/characters
    - name: Execute Chapter 1 scene 1 / reconcile character choices
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag director --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
        --index 0

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_direction
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_draft:
    name: Compile writing batches without rewriting
    needs:
    - s01_design
    - s01_draft_plan
    - s01_write_batches
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id008
    - *id007
    - &id033
      uses: actions/download-artifact@v4
      with:
        name: s01_draft_plan
        path: inputs/plan
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_write_batches-*
        path: inputs/batches
    - name: Compile writing batches without rewriting
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline merge_draft --backend "$backend" --index 0'
    - &id016
      name: Show generated prose before final acceptance
      if: always()
      run: python -m storyforge.expansion preview --source out --label "Compile writing batches without rewriting"
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_draft
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_edit:
    name: Forward prose unchanged for source-bound reviews
    needs:
    - s01_design
    - s01_draft
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id008
    - *id007
    - uses: actions/download-artifact@v4
      with:
        name: s01_draft
        path: inputs/draft
    - name: Forward prose unchanged for source-bound reviews
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline forward --backend "$backend" --index 0'
    - &id017
      name: Show generated prose before final acceptance
      if: always()
      run: python -m storyforge.expansion preview --source out --label "Forward prose unchanged for source-bound reviews"
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_edit
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_story:
    name: Compile story findings without another model call
    needs:
    - s01_design
    - s01_edit
    - s01_story_batches
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id008
    - *id007
    - &id009
      uses: actions/download-artifact@v4
      with:
        name: s01_edit
        path: inputs/edited
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_story_batches-*
        path: inputs/batches
    - name: Compile story findings without another model call
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline join_reviews --backend "$backend" --index 0 --kind story'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_story
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_rhetoric:
    name: Compile rhetoric findings without another model call
    needs:
    - s01_design
    - s01_edit
    - s01_rhetoric_batches
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id008
    - *id007
    - *id009
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_rhetoric_batches-*
        path: inputs/batches
    - name: Compile rhetoric findings without another model call
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline join_reviews --backend "$backend" --index 0 --kind rhetoric'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_rhetoric
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_memory:
    name: Compile complete source-bound memory; no summary substitution
    needs:
    - s01_design
    - s01_edit
    - s01_memory_extract_plan
    - s01_memory_extract_batches
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id008
    - *id007
    - *id009
    - &id042
      uses: actions/download-artifact@v4
      with:
        name: s01_memory_extract_plan
        path: inputs/plan
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_memory_extract_batches-*
        path: inputs/batches
    - name: Compile complete source-bound memory; no summary substitution
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline memory_extract_join --backend "$backend" --index 0'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_memory
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_repair:
    name: Merge targeted fixes; preserve untouched paragraphs
    needs:
    - s01_design
    - s01_edit
    - s01_repair_plan
    - s01_repair_batches
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id008
    - *id007
    - *id009
    - &id038
      uses: actions/download-artifact@v4
      with:
        name: s01_repair_plan
        path: inputs/plan
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_repair_batches-*
        path: inputs/batches
    - name: Merge targeted fixes; preserve untouched paragraphs
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline merge_repairs --backend "$backend" --index 0'
    - &id019
      name: Show generated prose before final acceptance
      if: always()
      run: python -m storyforge.expansion preview --source out --label "Merge targeted fixes; preserve untouched paragraphs"
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_repair
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_verify:
    name: Reuse final story verdict
    needs:
    - s01_design
    - s01_final_check
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id008
    - *id007
    - &id010
      uses: actions/download-artifact@v4
      with:
        name: s01_final_check
        path: inputs/edited
    - name: Reuse final story verdict
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline verdict_view --backend "$backend" --index 0 --kind story'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_verify
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_verify_rhetoric:
    name: Reuse final rhetoric verdict
    needs:
    - s01_design
    - s01_final_check
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id008
    - *id007
    - *id010
    - name: Reuse final rhetoric verdict
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline verdict_view --backend "$backend" --index 0 --kind rhetoric'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_verify_rhetoric
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_final_memory:
    name: Compile retained and refreshed facts without omission
    needs:
    - s01_design
    - s01_repair
    - s01_memory_refresh_plan
    - s01_memory_refresh_batches
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id008
    - *id007
    - &id011
      uses: actions/download-artifact@v4
      with:
        name: s01_repair
        path: inputs/edited
    - &id046
      uses: actions/download-artifact@v4
      with:
        name: s01_memory_refresh_plan
        path: inputs/plan
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_memory_refresh_batches-*
        path: inputs/batches
    - name: Compile retained and refreshed facts without omission
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline memory_extract_join --backend "$backend" --index 0'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_final_memory
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_memory_review:
    name: Compile final memory findings
    needs:
    - s01_design
    - s01_repair
    - s01_final_memory
    - s01_memory_final_plan
    - s01_memory_final_batches
    - s01_memory_preflight
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id008
    - *id007
    - *id011
    - &id013
      uses: actions/download-artifact@v4
      with:
        name: s01_final_memory
        path: inputs/memory
    - &id045
      uses: actions/download-artifact@v4
      with:
        name: s01_memory_preflight
        path: inputs/preflight-memory
    - &id047
      uses: actions/download-artifact@v4
      with:
        name: s01_memory_final_plan
        path: inputs/plan
    - uses: actions/download-artifact@v4
      with:
        pattern: s01_memory_final_batches-*
        path: inputs/batches
    - name: Compile final memory findings
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.batch_pipeline memory_check_join --backend "$backend" --index 0'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_memory_review
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s01_accept:
    name: Chapter 1 scene 1 / verify chapter and commit
    needs:
    - s01_design
    - s01_final_check
    - s01_verify
    - s01_verify_rhetoric
    - s01_final_memory
    - s01_memory_review
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs: *id012
    steps:
    - *id001
    - *id002
    - *id005
    - *id007
    - *id010
    - uses: actions/download-artifact@v4
      with:
        name: s01_verify
        path: inputs/story-review
    - uses: actions/download-artifact@v4
      with:
        name: s01_verify_rhetoric
        path: inputs/rhetoric-review
    - *id013
    - uses: actions/download-artifact@v4
      with:
        name: s01_memory_review
        path: inputs/memory-review
    - name: Execute Chapter 1 scene 1 / verify chapter and commit
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag accept --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST" --index
        0

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_accept
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s02_design:
    name: Chapter 2 scene 1 / reconcile design with accepted state
    needs:
    - s01_accept
    if: ${{ 1 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs: *id012
    steps:
    - *id001
    - *id002
    - *id005
    - uses: actions/download-artifact@v4
      with:
        name: s01_accept
        path: inputs/state
    - name: Execute Chapter 2 scene 1 / reconcile design with accepted state
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag scene_design --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
        --index 1

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s02_design
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s02_characters:
    name: Chapter 2 scene 1 / character ${{ matrix.character }}
    needs:
    - s02_design
    if: ${{ 1 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        character: ${{ fromJSON(needs.s02_design.outputs.characters) }}
    steps:
    - *id001
    - *id002
    - *id005
    - &id015
      uses: actions/download-artifact@v4
      with:
        name: s02_design
        path: inputs/state
    - name: Execute Chapter 2 scene 1 / character ${{ matrix.character }}
      id: task
      env: *id014
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag character --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
        --index 1 --character "$STORY_CHARACTER"

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s02_characters-${{ matrix.character }}
        path: out/
        retention-days: 30
        overwrite: true
    - *id003
    env: *id004
  s02_direction:
    name: Chapter 2 scene 1 / reconcile character choices
    needs:
    - s02_design
    - s02_characters
    if: ${{ 1 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id005
    - *id015
    - uses: actions/download-artifact@v4
      with:
        pattern: s02_characters-*
        path: inputs/characters
    - name: Execute Chapter 2 scene 1 / reconcile character choices
      id: task
      env: *id006
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag director --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
        --index 1

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
