name: Living universe / local models / full runner graph
'on':
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        options:
        - fixture
        - live
        default: fixture
        description: Live inference executes inside these jobs, without child workflows
      profile:
        type: choice
        options:
        - balanced
        - expressive
        - fast
        - small
        default: expressive
      request_file:
        type: string
        default: local-universe-massive
        description: Author universe bible and explicit next-scene layout in examples/
      scene_limit:
        type: choice
        options:
        - '1'
        default: '1'
      resume_run:
        type: string
        default: ''
        description: Prior accepted universe-canon run; empty starts a world
      checkpoint_artifact:
        type: choice
        options:
        - universe-canon
        - quickstart
        default: universe-canon
        description: Use quickstart only to retry a failed event while retaining its saved random draw
permissions:
  contents: read
  actions: read
concurrency:
  group: living-universe
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare request and literary retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: fixture
    - name: Check inference contracts before benchmark
      run: python -m unittest discover -s tests -q
    - name: Execute Prepare request and literary retrieval
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag prepare --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: prepare
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '1800'
  quickstart:
    name: Compile beginning quickly and propose one local world event
    needs:
    - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: ${{ inputs.backend }}
    - uses: actions/download-artifact@v4
      if: ${{ inputs.resume_run != '' }}
      with:
        name: ${{ inputs.checkpoint_artifact }}
        path: inputs/canon
        run-id: ${{ inputs.resume_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@v4
      with:
        name: prepare
        path: inputs/state
    - name: Execute Refine initial story prompt
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        CANON_RUN: ${{ inputs.resume_run }}
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        extra=()

        if [ -n "$CANON_RUN" ]; then extra=(--checkpoint inputs/canon/snapshot.json); fi

        python -m storyforge.living_prepare --backend "$backend" --source inputs/state/snapshot.json --out out "${extra[@]}"'
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: quickstart
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '1800'
  s01_design:
    name: Chapter 1 scene 1 / reconcile design with accepted state
    needs:
    - quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: ${{ inputs.backend }}
    - uses: actions/download-artifact@v4
      with:
        name: quickstart
        path: inputs/state
    - name: Execute Chapter 1 scene 1 / reconcile design with accepted state
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag scene_design --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
        --index 0

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_design
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '1800'
  s01_characters:
    name: Chapter 1 scene 1 / character ${{ matrix.character }}
    needs:
    - s01_design
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        character: ${{ fromJSON(needs.s01_design.outputs.characters) }}
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
      with:
        backend: ${{ inputs.backend }}
    - uses: actions/download-artifact@v4
      with:
        name: s01_design
        path: inputs/state
    - name: Execute Chapter 1 scene 1 / character ${{ matrix.character }}
      id: task
      env:
        PYTHONUNBUFFERED: 1
        STORY_BACKEND: ${{ inputs.backend }}
        STORY_PROFILE: ${{ inputs.profile }}
        STORY_REQUEST: ${{ inputs.request_file }}
        STORY_CHARACTER: ${{ matrix.character }}
      run: 'backend=fixture

        if [ "$STORY_BACKEND" = live ]; then backend=worker; fi

        python -m storyforge.dag character --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
        --index 0 --character "$STORY_CHARACTER"

        '
    - name: Save outputs and execution timeline
      uses: actions/upload-artifact@v4
      id: artifact
      if: always()
      with:
        name: s01_characters-${{ matrix.character }}
        path: out/
        retention-days: 30
        overwrite: true
    - name: Job status and artifact link
      if: always()
      env:
        STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        TASK_RESULT: ${{ job.status }}
      run: python -m storyforge.tracking report --out out
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '1800'
  s01_direction:
    name: Chapter 1 scene 1 / reconcile character choices
    needs:
    - s01_design
    - s01_characters
    if: ${{ 0 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Start shared job time budget
      run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-worker
