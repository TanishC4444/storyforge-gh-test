  results:
    name: Collect outputs and checkpoints
    timeout-minutes: 360
    if: always()
    needs:
    - prepare
    - quickstart
    - s01_design
    - s01_characters
    - s01_direction
    - s01_draft
    - s01_edit
    - s01_story
    - s01_rhetoric
    - s01_memory
    - s01_repair
    - s01_verify
    - s01_verify_rhetoric
    - s01_final_memory
    - s01_memory_review
    - s01_accept
    - s01_edit_plan
    - s01_edit_batches
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: results/
    - name: Collect readable prose independently of canon acceptance
      if: always()
      run: python -m storyforge.expansion collect --source results --out reading
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: readable-story
        path: reading/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: universe-canon
        path: reading/canon/
        retention-days: 30
        if-no-files-found: ignore
    - name: Save observed API and CPU usage, including failed attempts
      if: always()
      run: python -m storyforge.usage --source results --out results/usage-summary
    - name: Retain usage reports for 90 days
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: usage-${{ github.run_id }}
        path: results/usage-summary/
        retention-days: 30
        if-no-files-found: warn
    - uses: actions/upload-artifact@v4
      with:
        name: story-run-${{ github.run_id }}
        path: results/
        retention-days: 30
        overwrite: true
    - name: Summarize run
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
      run: "python - <<'PY'\nimport json, os\nresults = json.loads(os.environ['JOB_RESULTS'])\nfailed = [k for k, v in results.items()\
        \ if v['result'] in ['failure', 'cancelled']]\nfrom pathlib import Path\nstatuses=[]\nfor path in Path('results').rglob('status.json'):\n\
        \    statuses.append(json.loads(path.read_text()))\nrows=['## Story workflow progress', '', '| Job | Status | Last\
        \ phase | Seconds |', '|---|---|---|---:|']\nby_job={s.get('details',{}).get('job'):s for s in statuses}\nfor key,value\
        \ in results.items():\n    state=by_job.get(key,{})\n    phase=state.get('phase','No task status; inspect setup/input\
        \ steps' if value['result']=='failure' else value['result'])\n    if state.get('warnings_count'):phase+=' (%s warnings)'%state['warnings_count']\n\
        \    rows.append('| %s | %s | %s | %s |'%(key,value['result'],phase,state.get('elapsed_seconds','\u2014')))\nprogress=[s.get('story_progress',{})\
        \ for s in statuses]\naccepted=max((p.get('accepted_scenes',0) for p in progress),default=0)\nrows+=['','Checkpointed\
        \ scenes: **%s**'%accepted]\nlatest=max(progress,key=lambda p:p.get('accepted_scenes',0),default={})\nrows+=['','Draft\
        \ state: **%s**'%latest.get('completion_status','in_progress')]\nwith open(os.environ['GITHUB_STEP_SUMMARY'],'a')\
        \ as summary:\n    summary.write('\\n'.join(rows)+'\\n')\nprint('Failed/cancelled jobs:', failed)\nif failed:\n  \
        \  raise SystemExit(1)\nPY\n"
    env:
      STORY_REVIEW_TIMEOUT_SECONDS: '1800'
