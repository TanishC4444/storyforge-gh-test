name: Troy one-scene practice
on:
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        options: [fixture, live]
        default: fixture
        description: Live inference executes inside these jobs, without child workflows
      profile:
        type: choice
        options: [balanced, expressive, fast, small]
        default: small
      request_file:
        type: choice
        options: [troy-practice]
        default: troy-practice
      refinement_seed_run:
        type: string
        default: ''
        description: Optional prior run with saved refinement output to recover
      scene_limit:
        type: choice
        options: ['1']
        default: '1'
        description: One short scene with refinement, writing, quality and memory gates
permissions:
  contents: read
  actions: read
concurrency:
  group: story-practice
  cancel-in-progress: false
jobs:

  prepare:
    name: Prepare fresh brief and retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
      needs_repair: ${{ steps.task.outputs.needs_repair }}
      changed: ${{ steps.task.outputs.changed }}
      facts_changed: ${{ steps.task.outputs.facts_changed }}
    steps:
      - name: Start shared job budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: fixture
      - name: Check contracts and fixture paths
        run: python -m unittest discover -s tests -q
      - name: Install hybrid retrieval
        run: python -m pip install -e '.[rag]' -q
      - name: Execute Prepare fresh brief and retrieval
        id: task
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag prepare --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepare
          path: out/
          retention-days: 7
          overwrite: true

