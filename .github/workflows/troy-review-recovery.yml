# Generated by scripts/build_workflow.py. Commit regenerated changes.
name: Troy practice review recovery
on:
  workflow_dispatch:
    inputs:
      source_run:
        type: string
        required: true
        description: Source practice run with a written scene and approved memory
      backend:
        type: choice
        options: [fixture, live]
        default: fixture
        description: Live inference executes inside these jobs, without child workflows
      profile:
        type: choice
        options: [balanced, expressive, fast, small]
        default: small
      request_file:
        type: choice
        options: [troy-practice]
        default: troy-practice
      refinement_seed_run:
        type: string
        default: ''
        description: Optional prior run with saved refinement output to recover
      scene_limit:
        type: choice
        options: ['1']
        default: '1'
        description: One short scene with refinement, writing, quality and memory gates
permissions:
  contents: read
  actions: read
concurrency:
  group: story-review-recovery
  cancel-in-progress: false
jobs:

  s01_design:
    name: Restore source s01_design
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      needs_repair: ${{ steps.task.outputs.needs_repair }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: s01_design
          path: out
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Validate saved checkpoint
        id: task
        run: |
          python - <<'CHECK'
          import json
          from pathlib import Path
          state=json.loads(Path('out/snapshot.json').read_text())
          assert len(state['plan']['scenes'])==1 and not state['accepted'], 'Requires an uncommitted one-scene practice'
          assert not state['request'].get('execution_policy',{}).get('continue_with_warnings'), 'Strict gates required'
          assert state['request'].get('execution_policy',{}).get('literary_quality'), 'Literary policy required'
          CHECK
      - uses: actions/upload-artifact@v4
        with:
          name: s01_design
          path: out/

  s01_edit:
    name: Restore source s01_edit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      needs_repair: ${{ steps.task.outputs.needs_repair }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: s01_edit
          path: out
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Validate saved checkpoint
        id: task
        run: |
          test -f out/prose.txt
      - uses: actions/upload-artifact@v4
        with:
          name: s01_edit
          path: out/

  s01_memory:
    name: Restore source s01_memory
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      needs_repair: ${{ steps.task.outputs.needs_repair }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: s01_memory
          path: out
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Validate saved checkpoint
        id: task
        run: |
          python - <<'CHECK'
          import json,os
          from pathlib import Path
          review=json.loads(Path('out/memory-review.json').read_text())
          assert review['pass'], 'Source memory must already be approved'
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('needs_repair=false'+chr(10))
          CHECK
      - uses: actions/upload-artifact@v4
        with:
          name: s01_memory
          path: out/

  s01_story:
    name: s01 concurrent story dimensions
    needs: [s01_design, s01_edit]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
      needs_repair: ${{ steps.task.outputs.needs_repair }}
      changed: ${{ steps.task.outputs.changed }}
      facts_changed: ${{ steps.task.outputs.facts_changed }}
    steps:
      - name: Start shared job budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: s01_design
          path: inputs/state
      - uses: actions/download-artifact@v4
        with:
          name: s01_edit
          path: inputs/edited
      - name: Execute s01 concurrent story dimensions
        id: task
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag story_review --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST" --index 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01_story
          path: out/
          retention-days: 7
          overwrite: true


  s01_rhetoric:
    name: s01 concurrent rhetoric dimensions
    needs: [s01_design, s01_edit]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
      needs_repair: ${{ steps.task.outputs.needs_repair }}
      changed: ${{ steps.task.outputs.changed }}
      facts_changed: ${{ steps.task.outputs.facts_changed }}
    steps:
      - name: Start shared job budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: s01_design
          path: inputs/state
      - uses: actions/download-artifact@v4
        with:
          name: s01_edit
          path: inputs/edited
      - name: Execute s01 concurrent rhetoric dimensions
        id: task
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag rhetoric_review --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST" --index 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01_rhetoric
          path: out/
          retention-days: 7
          overwrite: true


  s01_repair:
    name: s01 paragraph patch batches
    needs: [s01_design, s01_edit, s01_story, s01_rhetoric, s01_memory]
    if: ${{ always() && !cancelled() && (needs.s01_story.outputs.needs_repair == 'true' || needs.s01_rhetoric.outputs.needs_repair == 'true' || needs.s01_memory.outputs.needs_repair == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
      needs_repair: ${{ steps.task.outputs.needs_repair }}
      changed: ${{ steps.task.outputs.changed }}
      facts_changed: ${{ steps.task.outputs.facts_changed }}
    steps:
      - name: Start shared job budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: s01_design
          path: inputs/state
      - uses: actions/download-artifact@v4
        with:
          name: s01_edit
          path: inputs/edited
      - uses: actions/download-artifact@v4
        with:
          name: s01_story
          path: inputs/diagnosis
      - uses: actions/download-artifact@v4
        with:
          name: s01_rhetoric
          path: inputs/rhetoric
      - uses: actions/download-artifact@v4
        with:
          name: s01_memory
          path: inputs/initial-memory
      - name: Execute s01 paragraph patch batches
        id: task
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag repair --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST" --index 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01_repair
          path: out/
          retention-days: 7
          overwrite: true


  s01_verify:
    name: s01 changed-paragraph story verification
    needs: [s01_design, s01_repair, s01_story]
    if: ${{ always() && !cancelled() && (needs.s01_repair.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
      needs_repair: ${{ steps.task.outputs.needs_repair }}
      changed: ${{ steps.task.outputs.changed }}
      facts_changed: ${{ steps.task.outputs.facts_changed }}
    steps:
      - name: Start shared job budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: s01_design
          path: inputs/state
      - uses: actions/download-artifact@v4
        with:
          name: s01_repair
          path: inputs/edited
      - uses: actions/download-artifact@v4
        with:
          name: s01_story
          path: inputs/diagnosis
      - name: Execute s01 changed-paragraph story verification
        id: task
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag verify --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST" --index 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01_verify
          path: out/
          retention-days: 7
          overwrite: true


  s01_verify_rhetoric:
    name: s01 changed-paragraph rhetoric verification
    needs: [s01_design, s01_repair, s01_rhetoric]
    if: ${{ always() && !cancelled() && (needs.s01_repair.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
      needs_repair: ${{ steps.task.outputs.needs_repair }}
      changed: ${{ steps.task.outputs.changed }}
      facts_changed: ${{ steps.task.outputs.facts_changed }}
    steps:
      - name: Start shared job budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: s01_design
          path: inputs/state
      - uses: actions/download-artifact@v4
        with:
          name: s01_repair
          path: inputs/edited
      - uses: actions/download-artifact@v4
        with:
          name: s01_rhetoric
          path: inputs/rhetoric
      - name: Execute s01 changed-paragraph rhetoric verification
        id: task
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag verify_rhetoric --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST" --index 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01_verify_rhetoric
          path: out/
          retention-days: 7
          overwrite: true


  s01_final_memory:
    name: s01 diff-based memory refresh
    needs: [s01_design, s01_repair, s01_memory]
    if: ${{ always() && !cancelled() && (needs.s01_repair.outputs.facts_changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
      needs_repair: ${{ steps.task.outputs.needs_repair }}
      changed: ${{ steps.task.outputs.changed }}
      facts_changed: ${{ steps.task.outputs.facts_changed }}
    steps:
      - name: Start shared job budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: s01_design
          path: inputs/state
      - uses: actions/download-artifact@v4
        with:
          name: s01_repair
          path: inputs/edited
      - uses: actions/download-artifact@v4
        with:
          name: s01_memory
          path: inputs/initial-memory
      - name: Execute s01 diff-based memory refresh
        id: task
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag memory_final --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST" --index 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01_final_memory
          path: out/
          retention-days: 7
          overwrite: true


  s01_memory_review:
    name: s01 changed-fact verification
    needs: [s01_design, s01_repair, s01_final_memory]
    if: ${{ always() && !cancelled() && (needs.s01_final_memory.outputs.facts_changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
      needs_repair: ${{ steps.task.outputs.needs_repair }}
      changed: ${{ steps.task.outputs.changed }}
      facts_changed: ${{ steps.task.outputs.facts_changed }}
    steps:
      - name: Start shared job budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: s01_design
          path: inputs/state
      - uses: actions/download-artifact@v4
        with:
          name: s01_repair
          path: inputs/edited
      - uses: actions/download-artifact@v4
        with:
          name: s01_final_memory
          path: inputs/memory
      - name: Execute s01 changed-fact verification
        id: task
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag memory_review --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST" --index 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01_memory_review
          path: out/
          retention-days: 7
          overwrite: true


  s01_accept:
    name: s01 accept with conditional fallbacks
    needs: [s01_design, s01_edit, s01_story, s01_rhetoric, s01_memory, s01_repair, s01_verify, s01_verify_rhetoric, s01_final_memory, s01_memory_review]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.s01_design.result == 'success' && needs.s01_edit.result == 'success' && needs.s01_story.result == 'success' && needs.s01_rhetoric.result == 'success' && needs.s01_memory.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
      needs_repair: ${{ steps.task.outputs.needs_repair }}
      changed: ${{ steps.task.outputs.changed }}
      facts_changed: ${{ steps.task.outputs.facts_changed }}
    steps:
      - name: Start shared job budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: ${{ inputs.backend }}
      - uses: actions/download-artifact@v4
        with:
          name: s01_design
          path: inputs/state
      - uses: actions/download-artifact@v4
        with:
          name: s01_edit
          path: inputs/edited
      - uses: actions/download-artifact@v4
        with:
          name: s01_story
          path: inputs/initial-story
      - uses: actions/download-artifact@v4
        with:
          name: s01_rhetoric
          path: inputs/initial-rhetoric
      - uses: actions/download-artifact@v4
        with:
          name: s01_memory
          path: inputs/memory
      - uses: actions/download-artifact@v4
        if: ${{ needs.s01_repair.result == 'success' }}
        with:
          name: s01_repair
          path: inputs/repair
      - uses: actions/download-artifact@v4
        if: ${{ needs.s01_verify.result == 'success' }}
        with:
          name: s01_verify
          path: inputs/verified
      - uses: actions/download-artifact@v4
        if: ${{ needs.s01_verify_rhetoric.result == 'success' }}
        with:
          name: s01_verify_rhetoric
          path: inputs/verified-rhetoric
      - uses: actions/download-artifact@v4
        if: ${{ needs.s01_final_memory.result == 'success' }}
        with:
          name: s01_final_memory
          path: inputs/final-memory
      - uses: actions/download-artifact@v4
        if: ${{ needs.s01_memory_review.result == 'success' }}
        with:
          name: s01_memory_review
          path: inputs/memory-review
      - name: Execute s01 accept with conditional fallbacks
        id: task
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag accept --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST" --index 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01_accept
          path: out/
          retention-days: 7
          overwrite: true


  results:
    name: Collect outputs and checkpoints
    timeout-minutes: 360
    if: always()
    needs: [s01_design, s01_edit, s01_memory, s01_story, s01_rhetoric, s01_repair, s01_verify, s01_verify_rhetoric, s01_final_memory, s01_memory_review, s01_accept]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results/
      - name: Save observed API and CPU usage, including failed attempts
        if: always()
        run: python -m storyforge.usage --source results --out results/usage-summary
      - name: Retain usage reports for 90 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usage-${{ github.run_id }}
          path: results/usage-summary/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: story-run-${{ github.run_id }}
          path: results/
          retention-days: 7
          overwrite: true
      - name: Publish clearly labelled story download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: READABLE-STORY-${{ github.run_id }}
          path: |
            results/s01_accept/FINAL_STORY.txt
            results/s01_accept/PROVISIONAL_STORY.txt
            results/s01_accept/READ_ME.txt
          if-no-files-found: warn
      - name: Summarize run
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = [k for k, v in results.items() if v['result'] in ['failure', 'cancelled']]
          from pathlib import Path
          statuses=[]
          for path in Path('results').rglob('status.json'):
              statuses.append(json.loads(path.read_text()))
          rows=['## Story workflow progress', '', '| Job | Status | Last phase | Seconds |', '|---|---|---|---:|']
          by_job={s.get('details',{}).get('job'):s for s in statuses}
          for key,value in results.items():
              state=by_job.get(key,{})
              phase=state.get('phase','No task status; inspect setup/input steps' if value['result']=='failure' else value['result'])
              if state.get('warnings_count'):phase+=' (%s warnings)'%state['warnings_count']
              rows.append('| %s | %s | %s | %s |'%(key,value['result'],phase,state.get('elapsed_seconds','—')))
          progress=[s.get('story_progress',{}) for s in statuses]
          accepted=max((p.get('accepted_scenes',0) for p in progress),default=0)
          rows+=['','Checkpointed scenes: **%s**'%accepted]
          latest=max(progress,key=lambda p:p.get('accepted_scenes',0),default={})
          rows+=['','Draft state: **%s**'%latest.get('completion_status','in_progress')]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('\n'.join(rows)+'\n')
          print('Failed/cancelled jobs:', failed)
          if failed:
              raise SystemExit(1)
          PY
