# Generated by scripts/build_workflow.py. Commit regenerated changes.
name: Troy continuation / parallel passage editors
on:
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        options: [fixture, live]
        default: fixture
        description: Live inference executes inside these jobs, without child workflows
      profile:
        type: choice
        options: [balanced, expressive, fast, small]
        default: fast
      request_file:
        type: choice
        options: [troy-first-thunder]
        default: troy-first-thunder
      checkpoint_run:
        type: string
        default: '39536276390'
        description: Source run containing the committed s02_accept artifact
      refinement_seed_run:
        type: string
        default: ''
        description: Optional prior run with saved refinement output to recover
      scene_limit:
        type: choice
        options: ['4']
        default: '4'
        description: Four scenes is the full opening movement
permissions:
  contents: read
  actions: read
concurrency:
  group: story-runners
  cancel-in-progress: false
jobs:

  resume:
    name: Restore first two committed scenes
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
    steps:
      - name: Start shared job time budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
        with:
          backend: fixture
      - uses: actions/download-artifact@v4
        with:
          name: s02_accept
          path: inputs/checkpoint
          run-id: ${{ inputs.checkpoint_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: s03_design
          path: inputs/saved-design
          run-id: ${{ inputs.checkpoint_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: s03_draft
          path: inputs/saved-draft
          run-id: ${{ inputs.checkpoint_run }}
          github-token: ${{ github.token }}
      - name: Execute Restore first two committed scenes
        id: task
        env:
          PYTHONUNBUFFERED: 1
          STORY_BACKEND: ${{ inputs.backend }}
          STORY_PROFILE: ${{ inputs.profile }}
          STORY_REQUEST: ${{ inputs.request_file }}
          REFINEMENT_SEED_RUN: ${{ inputs.refinement_seed_run }}
          CONTINUATION_RUN: ${{ inputs.checkpoint_run }}
        run: |
          backend=fixture
          if [ "$STORY_BACKEND" = live ]; then backend=worker; fi
          python -m storyforge.dag resume --backend "$backend" --profile "$STORY_PROFILE" --request-file "$STORY_REQUEST"
      - name: Save outputs and execution timeline
        uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
          name: resume
          path: out/
          retention-days: 7
          overwrite: true
      - name: Job status and artifact link
        if: always()
        env:
          STORY_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          TASK_RESULT: ${{ job.status }}
        run: python -m storyforge.tracking report --out out

  s03_design:
    name: Chapter 1 scene 3 / reconcile design with accepted state
    needs: [resume]
    if: ${{ 2 < fromJSON(inputs.scene_limit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      characters: ${{ steps.task.outputs.characters }}
    steps:
      - name: Start shared job time budget
        run: echo "STORY_JOB_DEADLINE=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-worker
