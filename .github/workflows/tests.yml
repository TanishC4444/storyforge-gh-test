name: Tests
on: [push, pull_request]
permissions:
  contents: read
env:
  GEMINI_DISTINCT_PROJECTS: 'true'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared test dependencies
        run: python -m pip install -e '.[test]' -q
      - name: Install API dependencies
        run: python -m pip install -e '.[api]' -q
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser API client and streaming errors
        run: node --test tests/test_web_client.mjs
