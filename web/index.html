<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ParaMyth</title>
  <meta name="description" content="Start, follow and read ParaMyth story runs.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23203970%22/%3E%3Cpath d=%22M16 4l2.6 8.4L27 16l-8.4 2.6L16 27l-2.6-8.4L5 16l8.4-3.6z%22 fill=%22%23F2C358%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/"><span class="brand-star" aria-hidden="true">✦</span>ParaMyth <span>Story studio</span></a>
    <span class="row">
      <a href="console.html" class="muted">API console</a>
      <button type="button" id="conn-pill" class="pill" title="Show connection settings">Not connected</button>
    </span>
  </header>

  <section id="connect" class="panel connect">
    <form id="connect-form">
      <label>API URL
        <input id="api-url" type="url" required placeholder="http://localhost:8000">
      </label>
      <label>GitHub token
        <input id="token" type="password" autocomplete="off" placeholder="ghp_… or github_pat_…">
      </label>
      <div class="row">
        <button type="submit">Connect</button>
        <button type="button" id="use-demo" class="secondary">Use demo data</button>
        <button type="button" id="disconnect" class="ghost">Forget token</button>
      </div>
      <p class="hint">The token stays in this tab (sessionStorage) and is sent only to the API URL above.
        It needs Actions read/write on the repo. "Demo" needs no token.</p>
    </form>
    <p id="connect-msg" class="msg" role="status"></p>
  </section>

  <div class="hero">
    <figure><img src="assets/paramyth-banner.webp" width="1280" height="720" alt="ParaMyth: an open storybook with swirling mint and navy smoke and golden stars"></figure>
  </div>

  <main id="view"></main>

  <template id="tpl-home">
    <div class="grid">
      <section class="panel">
        <h2>Start a run</h2>
        <div class="tabs" id="mode-tabs" role="tablist"></div>
        <p class="muted" id="mode-desc"></p>
        <form id="start-form">
          <label>Story brief
            <select id="brief" required></select>
          </label>
          <div id="brief-card" class="brief-card"></div>
          <div id="mode-inputs"></div>
          <button type="submit">Start run</button>
          <p id="start-msg" class="msg" role="status"></p>
        </form>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2>Runs</h2>
          <div class="row">
            <select id="runs-mode" aria-label="Filter by mode">
              <option value="">All modes</option>
              <option value="sequential">Sequential</option>
              <option value="parallel">Parallel</option>
              <option value="recovery">Recovery</option>
            </select>
            <button type="button" id="refresh" class="ghost">Refresh</button>
          </div>
        </div>
        <ul id="runs" class="runs"></ul>
      </section>
    </div>
  </template>

  <template id="tpl-run">
    <section class="panel">
      <a href="#/" class="back">← All runs</a>
      <div class="panel-head">
        <div>
          <h2 id="run-title"></h2>
          <p class="muted" id="run-meta"></p>
        </div>
        <span id="run-status" class="badge"></span>
      </div>
      <div class="progress"><div id="progress-bar"></div></div>
      <p class="muted" id="progress-text"></p>
      <ul id="warnings" class="warnings"></ul>
      <div class="row" id="run-actions">
        <button type="button" id="cancel" class="secondary" hidden>Cancel run</button>
        <a id="gh-link" class="ghost-link" target="_blank" rel="noopener" hidden>Open on GitHub</a>
      </div>
      <form id="recover-form" class="recover" hidden>
        <h3>Recover this run</h3>
        <div class="row wrap">
          <label>Strategy <select name="strategy"><option value="fresh">Fresh run from saved prefix</option><option value="rerun">Rerun failed stage in place</option></select></label>
          <label>Scene <select name="scene"><option>auto</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
          <label>Restart stage <select name="restart_stage"><option>auto</option><option>editing</option><option>memory</option><option>scene</option></select></label>
        </div>
        <button type="submit">Recover</button>
        <p id="recover-msg" class="msg" role="status"></p>
      </form>
    </section>
    <section class="panel">
      <div class="tabs" role="tablist">
        <button type="button" data-tab="story" class="active">Story</button>
        <button type="button" data-tab="jobs">Jobs</button>
        <button type="button" data-tab="canon">Canon</button>
        <button type="button" data-tab="artifacts">Artifacts</button>
      </div>
      <div id="tab-body"></div>
    </section>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
